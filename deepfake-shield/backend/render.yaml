services:
  - type: web
    name: deepfake-shield-backend
    env: python
    rootDir: deepfake-shield/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: "INFO"
      - key: GOOGLE_FACTCHECK_API_KEY
        sync: false