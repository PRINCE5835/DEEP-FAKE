[build]
  base = "deepfake-shield"
  publish = "deepfake-shield"

[[redirects]]
  source = "/api/v1/:splat"
  dest = "https://deepfake-shield-backend.onrender.com/api/v1/:splat"
  status = 200

[[redirects]]
  source = "/api/:splat"
  dest = "https://deepfake-shield-backend.onrender.com/api/:splat"
  status = 200

[[redirects]]
  source = "/*"
  dest = "/index.html"
  status = 200
